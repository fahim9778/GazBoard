name: Editor smoke
on:
  push:
    branches: ['main']
  pull_request:
    paths: ['src/**', 'test/**', 'scripts/**', 'main.js', 'preload.js', 'package*.json', '.github/workflows/smoke.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: smoke-${{ github.ref }}
  cancel-in-progress: true
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run smoke:builtin
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GazBoard-editor-smoke
          path: test/out/
          retention-days: 7
