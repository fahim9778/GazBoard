# Builds and publishes GazBoard for Android.
#
# To cut a release:
#     git tag android-2.6.5-v1
#     git push origin android-2.6.5-v1
#
# The tag is <board version>-v<android build>. 2.6.5-v1 is the first Android
# build of the 2.6.5 board code; a second one off the same code is 2.6.5-v2.
# Tags here never start with "v", so this can never trip the desktop release
# workflow, and the desktop version in package.json is never touched by an
# Android-only release.
#
# Run it by hand from the Actions tab first (Run workflow) whenever you change
# something: that builds, signs and verifies without publishing anything, so a
# broken build can never become a public download.
#
# Needs three repository secrets, under Settings -> Secrets and variables ->
# Actions. The keystore is a private key and is never committed:
#   ANDROID_KEYSTORE_BASE64    - the .jks file, base64 encoded
#   ANDROID_KEYSTORE_PASSWORD  - its password
#   ANDROID_KEY_ALIAS          - the key alias inside it
name: Android release

on:
  push:
    tags: ['android-*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      # Work out the version before anything else, so a malformed tag stops the
      # run in two seconds rather than after a twenty-minute build.
      - name: Work out the version
        id: version
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            TAG="${GITHUB_REF_NAME}"
            case "$TAG" in
              android-*-v*) ;;
              *) echo "::error::Tag '$TAG' is not android-<version>-v<build>, e.g. android-2.6.5-v1"; exit 1 ;;
            esac
            REST="${TAG#android-}"
            VERSION="${REST%-v*}"
            BUILD="${REST##*-v}"
          else
            # A manual run builds the current board version as build 0, which is
            # never published. It exists to prove the build works.
            VERSION="$(node -p "require('./package.json').version")"
            BUILD="0"
          fi
          case "$VERSION" in
            [0-9]*.[0-9]*.[0-9]*) ;;
            *) echo "::error::'$VERSION' is not a three-part version"; exit 1 ;;
          esac
          case "$BUILD" in
            ''|*[!0-9]*) echo "::error::Build '$BUILD' is not a number"; exit 1 ;;
          esac
          PKG="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG" ] && [ "$BUILD" != "0" ]; then
            echo "::error::Tag says $VERSION but package.json says $PKG. Tag the version this code actually is."
            exit 1
          fi
          # 2.6.5 build 1 -> 2 06 05 01, so the code only ever increases.
          MAJOR="${VERSION%%.*}"; R="${VERSION#*.}"; MINOR="${R%%.*}"; PATCH="${R#*.}"
          CODE=$(( ((10#$MAJOR * 100 + 10#$MINOR) * 100 + 10#$PATCH) * 100 + 10#$BUILD ))
          {
            echo "version=$VERSION"
            echo "build=$BUILD"
            echo "code=$CODE"
            echo "name=$VERSION-android.$BUILD"
            echo "apk=GazBoard-$VERSION-android-v$BUILD.apk"
            echo "aab=GazBoard-$VERSION-android-v$BUILD.aab"
          } >> "$GITHUB_OUTPUT"
          echo "Building GazBoard $VERSION-android.$BUILD (versionCode $CODE)"

      # Fail before building rather than after, if the secrets are not set up.
      - name: Check the signing secrets exist
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          missing=""
          [ -n "$KEYSTORE" ] || missing="$missing ANDROID_KEYSTORE_BASE64"
          [ -n "$PASSWORD" ] || missing="$missing ANDROID_KEYSTORE_PASSWORD"
          [ -n "$ALIAS" ] || missing="$missing ANDROID_KEY_ALIAS"
          if [ -n "$missing" ]; then
            echo "::error::Missing repository secret(s):$missing"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - run: npm ci

      # The board code is what the app actually runs. If it is broken, nothing
      # below this line is worth building.
      - name: Test the board code
        run: npm run test:all

      - name: Unpack the keystore
        env:
          KEYSTORE: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE" | base64 -d > "$RUNNER_TEMP/release.jks"
          # A truncated or mis-pasted secret is easier to diagnose here than as
          # a confusing Gradle error four minutes later.
          test -s "$RUNNER_TEMP/release.jks"

      - name: Build the signed APK and AAB
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_VERSION_NAME: ${{ steps.version.outputs.name }}
          ANDROID_VERSION_CODE: ${{ steps.version.outputs.code }}
          ANDROID_BUILD_NUMBER: ${{ steps.version.outputs.build }}
          UPLOAD_KEYSTORE: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          UPLOAD_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          UPLOAD_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
        # The APK is the GitHub copy; the AAB is only ever for Google Play, so it is
        # built as a Play copy that never looks at GitHub for updates.
        #
        # Google Play is handed the AAB signed with the UPLOAD key once its three
        # secrets exist (Play keeps the real app signing key itself). Until then the
        # AAB is signed with the release key, exactly as before.
        run: |
          set -euo pipefail
          ./android/gradlew -p android :app:assembleRelease --stacktrace
          if [ -n "${UPLOAD_KEYSTORE:-}" ] && [ -n "${UPLOAD_PASSWORD:-}" ] && [ -n "${UPLOAD_ALIAS:-}" ]; then
            echo "$UPLOAD_KEYSTORE" | base64 -d > "$RUNNER_TEMP/upload.jks"
            test -s "$RUNNER_TEMP/upload.jks"
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/upload.jks" ANDROID_KEYSTORE_PASSWORD="$UPLOAD_PASSWORD" ANDROID_KEY_ALIAS="$UPLOAD_ALIAS" ANDROID_KEY_PASSWORD="$UPLOAD_PASSWORD"
            echo "Signing the Play bundle with the upload key"
          else
            echo "No upload key secrets yet: signing the Play bundle with the release key"
          fi
          ./android/gradlew -p android :app:bundleRelease -Pgazboard.distribution=play --stacktrace

      - name: Collect and verify
        id: collect
        env:
          APK_NAME: ${{ steps.version.outputs.apk }}
          AAB_NAME: ${{ steps.version.outputs.aab }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK="$(find android/app/build/outputs/apk/release -name '*.apk' | head -1)"
          AAB="$(find android/app/build/outputs/bundle/release -name '*.aab' | head -1)"
          test -n "$APK" || { echo "::error::No APK was produced"; exit 1; }
          test -n "$AAB" || { echo "::error::No AAB was produced"; exit 1; }

          # The one that has bitten us: an unsigned APK installs nowhere and
          # says only "there was a problem parsing the package". Gradle names it
          # -unsigned when no signing config applied, so refuse it by name AND
          # by asking apksigner, which is the thing that actually knows.
          case "$APK" in
            *unsigned*) echo "::error::The APK is unsigned - check the signing secrets"; exit 1 ;;
          esac

          cp "$APK" "dist/$APK_NAME"
          cp "$AAB" "dist/$AAB_NAME"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)"
          "$APKSIGNER" verify --print-certs --verbose "dist/$APK_NAME"

          ( cd dist && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt )
          ls -lh dist

      # Always, so a failed verification still leaves you something to look at.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GazBoard-Android-${{ steps.version.outputs.version }}-v${{ steps.version.outputs.build }}
          path: dist/
          retention-days: 14

      # Only a tag publishes. A manual run has done its job by getting here.
      - name: Publish the release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ steps.version.outputs.version }}
          BUILD: ${{ steps.version.outputs.build }}
        run: |
          set -euo pipefail
          NOTES="$(mktemp)"
          # Every paragraph is ONE line. GitHub keeps the line breaks inside a
          # paragraph, so text wrapped at 70 columns here came out as a narrow
          # squashed column on the release page.
          WHATS_NEW="release-notes/$VERSION.md"
          {
            if [ -f "$WHATS_NEW" ]; then
              cat "$WHATS_NEW"
              echo
            else
              echo "::warning::No $WHATS_NEW - the Android release goes out with install notes only" >&2
            fi
            echo "## Install"
            echo
            echo "GazBoard for Android $VERSION (build $BUILD). Download the .apk and open it on your phone. Android will ask you to allow installing from this source - that is normal for an app that does not come from the Play Store. If you have a test build installed, uninstall it first: it was signed with a different key and Android will refuse to replace it."
            echo
            echo "**Opening board files:** .gazboard and .openboard are GazBoard's own formats, so open them from inside GazBoard with Open board. GazBoard does not register as a general file viewer, so it will not appear in Open with for PDFs, images or other files."
            echo
            echo "The .aab is for Google Play and cannot be installed directly. Runs on this device: no account, no sign-in, no cloud."
          } > "$NOTES"
          # --latest=false leaves the "Latest" badge on the desktop release.
          # gh marks every new non-prerelease as the latest by default, so
          # without this an Android build quietly takes the badge off whatever
          # desktop version is current - and GitHub shows the badged release at
          # the top of the Releases page, so the page ends up claiming an older
          # Android build is the newest thing in the repo. The tag stays
          # android-<version>-v<build>: it must NOT start with "v", or it would
          # fire the desktop release workflow and put an Android build in front
          # of desktop users looking for an update.
          gh release create "$TAG" dist/* \
            --latest=false \
            --title "GazBoard for Android $VERSION (build $BUILD)" \
            --notes-file "$NOTES"
