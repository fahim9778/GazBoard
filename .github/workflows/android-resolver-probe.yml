name: Android resolver probe (temporary)

on:
  push:
    branches: ['probe/android-resolver']
    paths:
      - 'android/**'
      - '.github/workflows/android-resolver-probe.yml'

permissions:
  contents: read

concurrency:
  group: android-resolver-probe
  cancel-in-progress: true

jobs:
  build-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build side-by-side resolver probe APK
        run: ./android/gradlew -p android :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: GazBoard-Resolver-Probe
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
