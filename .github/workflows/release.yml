# Builds GazBoard for Windows, Linux and macOS and publishes a GitHub Release.
#
# To cut a release:
#     write release-notes/1.16.1.md (it becomes the release's text)
#     git tag v1.16.1
#     git push origin v1.16.1
#
# You can also run it by hand from the Actions tab (Run workflow), which builds
# and uploads the artifacts without creating a Release - do that first whenever
# you change something, so a broken build never becomes a public download.
#
# On a public repository this costs nothing: GitHub-hosted runners are free for
# public repos, Windows included.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write        # needed to create the Release and upload files to it

jobs:
  validate-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate Git tag matches package.json version
        run: |
          node -e "const pkg = require('./package.json'); if (process.env.GITHUB_REF_TYPE === 'tag' && 'v' + pkg.version !== process.env.GITHUB_REF_NAME) { console.error('Tag mismatch: Git tag ' + process.env.GITHUB_REF_NAME + ' does not match package.json v' + pkg.version); process.exit(1); } console.log('Version consistency verified: ' + pkg.version);"

  windows:
    needs: [validate-version]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npx electron . --smoke
        # a failed assertion exits non-zero, so a broken build never ships

      - name: Build the installer and the portable build
        # Both targets have to be named here. Naming any target on the command
        # line REPLACES build.win.target in package.json rather than adding to
        # it, so "--win nsis" silently dropped the portable build that
        # package.json asks for - which is why no release before 2.4.2 has one.
        run: npx electron-builder --win nsis portable --x64 --publish never

      # The in-app updater (updater.js) reads latest.yml for the installer's
      # SHA-512, and the .blockmap files to fetch only the parts that changed.
      # Without them an installed GazBoard cannot update itself, so their
      # absence fails the build instead of shipping a release it cannot reach.
      - name: Check the files the in-app updater needs
        shell: bash
        run: |
          set -e
          V="$(node -p "require('./package.json').version")"
          test -f dist/latest.yml || { echo "::error::no dist/latest.yml - is build.publish set in package.json?"; exit 1; }
          grep -q "^version: ${V}$" dist/latest.yml || { echo "::error::latest.yml is not for ${V}"; cat dist/latest.yml; exit 1; }
          grep -q "GazBoard-Setup-${V}.exe" dist/latest.yml || { echo "::error::latest.yml does not name the installer"; cat dist/latest.yml; exit 1; }
          grep -q "sha512:" dist/latest.yml || { echo "::error::latest.yml has no checksum"; exit 1; }
          test -s "dist/GazBoard-Setup-${V}.exe.blockmap" || { echo "::error::no blockmap for the installer"; exit 1; }
          cat dist/latest.yml

      - name: Upload build output as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazBoard-windows
          path: |
            dist/*.exe
            dist/latest.yml
            dist/*.exe.blockmap
          if-no-files-found: error

      # The notes come from release-notes/<version>.md, written alongside the
      # code, so a green build publishes finished notes with nobody editing
      # the release by hand afterwards. No file for this version: GitHub's own
      # list of changes, as before.
      - name: Find the release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          F="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$F" ]; then
            echo "Using $F"
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No $F - falling back to GitHub's generated notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # latest.yml and the installer's .blockmap are what the in-app
          # updater reads: the checksum to verify against, and the map that
          # lets it download only what changed since the last version.
          files: |
            dist/*.exe
            dist/latest.yml
            dist/GazBoard-Setup-*.exe.blockmap
          name: GazBoard ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

  linux:
    needs: [validate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: xvfb-run -a npx electron . --smoke --no-sandbox

      - name: Build the AppImage and .deb
        run: npx electron-builder --linux AppImage deb --x64 --publish never

      # Makes the AppImage updatable with AppImageUpdate (appimageupdatetool).
      # electron-builder's own AppImage carries no update information, so it is
      # unpacked and repacked with appimagetool, which embeds the string and,
      # because zsyncmake is installed, writes the matching .zsync file.
      # The repacked file replaces the original under the SAME versioned name,
      # so the boot test below and the release upload both pick it up.
      # The owner/repo come from the workflow's own repository, so a fork's
      # builds point at the fork's releases instead of the upstream's.
      - name: Embed update information and generate the .zsync
        env:
          APPIMAGETOOL_VERSION: '1.9.0'
          # SHA-256 of appimagetool-x86_64.AppImage for the version above.
          # Bump both together and recompute with: sha256sum <downloaded file>
          APPIMAGETOOL_SHA256: '46fdd785094c7f6e545b61afcfb0f3d98d8eab243f644b4b17698c01d06083d1'
          # Pin the runtime too; update its SHA-256 when changing the version.
          APPIMAGE_RUNTIME_VERSION: '20251108'
          APPIMAGE_RUNTIME_SHA256: '2fca8b443c92510f1483a883f60061ad09b46b978b2631c807cd873a47ec260d'
          ARCH: x86_64
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y -qq zsync desktop-file-utils  # zsyncmake and desktop-file-validate

          UPDATE_INFO="gh-releases-zsync|${GITHUB_REPOSITORY%%/*}|${GITHUB_REPOSITORY##*/}|latest|GazBoard-*.AppImage.zsync"

          TOOL="$RUNNER_TEMP/appimagetool"
          curl -fsSL -o "$TOOL" \
            "https://github.com/AppImage/appimagetool/releases/download/${APPIMAGETOOL_VERSION}/appimagetool-x86_64.AppImage"
          echo "${APPIMAGETOOL_SHA256}  ${TOOL}" | sha256sum -c -
          chmod +x "$TOOL"

          RUNTIME="$RUNNER_TEMP/runtime-x86_64"
          curl -fsSL -o "$RUNTIME" \
            "https://github.com/AppImage/type2-runtime/releases/download/${APPIMAGE_RUNTIME_VERSION}/runtime-x86_64"
          echo "${APPIMAGE_RUNTIME_SHA256}  ${RUNTIME}" | sha256sum -c -
          chmod +x "$RUNTIME"

          shopt -s nullglob
          APPIMAGES=(dist/*.AppImage)
          if [ "${#APPIMAGES[@]}" -ne 1 ]; then
            echo "::error::expected exactly one AppImage in dist/, found ${#APPIMAGES[@]}"
            exit 1
          fi
          SRC="$GITHUB_WORKSPACE/${APPIMAGES[0]}"
          NAME="$(basename "$SRC")"

          WORK="$RUNNER_TEMP/appimage-repack"
          rm -rf "$WORK"
          mkdir -p "$WORK/out"
          chmod +x "$SRC"
          ( cd "$WORK" && "$SRC" --appimage-extract >/dev/null )
          test -d "$WORK/squashfs-root"

          # Run from the output directory: the .zsync is written beside the
          # new AppImage, named "<AppImage name>.zsync".
          # APPIMAGE_EXTRACT_AND_RUN is set for this one command only (the runner
          # has no FUSE for appimagetool itself). Left set for the whole step,
          # it would make the repacked AppImage launch the app instead of
          # answering --appimage-updateinformation below.
          ( cd "$WORK/out" && APPIMAGE_EXTRACT_AND_RUN=1 "$TOOL" --no-appstream --runtime-file "$RUNTIME" -u "$UPDATE_INFO" "$WORK/squashfs-root" "$NAME" )

          # Both files must exist and be non-empty, or the release does not go out.
          test -s "$WORK/out/$NAME"       || { echo "::error::repacked AppImage is missing or empty"; exit 1; }
          test -s "$WORK/out/$NAME.zsync" || { echo "::error::$NAME.zsync is missing or empty"; ls -la "$WORK/out"; exit 1; }

          # The embedded update information must be exactly what we asked for.
          chmod +x "$WORK/out/$NAME"
          GOT="$(env -u APPIMAGE_EXTRACT_AND_RUN "$WORK/out/$NAME" --appimage-updateinformation)"
          if [ "$GOT" != "$UPDATE_INFO" ]; then
            echo "::error::update information mismatch"
            echo "expected: $UPDATE_INFO"
            echo "got:      $GOT"
            exit 1
          fi

          # Confirm the repacked AppImage carries the pinned runtime.
          WANT_RT="$(env -u APPIMAGE_EXTRACT_AND_RUN "$RUNTIME" --appimage-version 2>&1)"
          GOT_RT="$(env -u APPIMAGE_EXTRACT_AND_RUN "$WORK/out/$NAME" --appimage-version 2>&1)"
          if [ "$GOT_RT" != "$WANT_RT" ]; then
            echo "::error::AppImage runtime is not the pinned one"
            echo "expected: $WANT_RT"
            echo "got:      $GOT_RT"
            exit 1
          fi

          # The .zsync must name the asset exactly as it will be uploaded,
          # otherwise AppImageUpdate cannot find the file to download.
          grep -a -m1 -qx "Filename: $NAME" "$WORK/out/$NAME.zsync" \
            || { echo "::error::$NAME.zsync does not reference $NAME"; head -c 400 "$WORK/out/$NAME.zsync" | strings; exit 1; }

          mv -f "$WORK/out/$NAME" "dist/$NAME"
          mv -f "$WORK/out/$NAME.zsync" "dist/$NAME.zsync"
          ls -la dist/*.AppImage dist/*.AppImage.zsync
          echo "update info: $GOT"

      # Proof the packaged AppImage really starts, not just that it built. The
      # screenshot ships with the artifacts, so it can be checked from any
      # machine - useful when you have no Linux box to hand.
      - name: Boot the AppImage and photograph it
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick libfuse2 xvfb
          chmod +x dist/*.AppImage
          cat > /tmp/boot.sh <<'SH'
          #!/bin/bash
          dist/*.AppImage --no-sandbox --disable-gpu > /tmp/appimage.log 2>&1 &
          PID=$!
          sleep 20
          import -window root dist/linux-boot-screenshot.png
          kill $PID 2>/dev/null || true
          SH
          chmod +x /tmp/boot.sh
          xvfb-run -a --server-args="-screen 0 1440x900x24" /tmp/boot.sh
          test -s dist/linux-boot-screenshot.png || { echo "the AppImage did not draw anything"; cat /tmp/appimage.log; exit 1; }
          echo "AppImage booted and rendered"

      - name: Upload build output as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazBoard-linux
          path: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
            dist/linux-boot-screenshot.png
          if-no-files-found: error

      # The notes come from release-notes/<version>.md, written alongside the
      # code, so a green build publishes finished notes with nobody editing
      # the release by hand afterwards. No file for this version: GitHub's own
      # list of changes, as before.
      - name: Find the release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          F="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$F" ]; then
            echo "Using $F"
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No $F - falling back to GitHub's generated notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          # The .zsync sits beside the AppImage so AppImageUpdate can find it
          # through the embedded gh-releases-zsync|...|latest|... string.
          files: |
            dist/*.AppImage
            dist/*.AppImage.zsync
            dist/*.deb
          name: GazBoard ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

  macos:
    needs: [validate-version]
    # GitHub's macOS runners are Apple Silicon, and they can cross-build the
    # Intel slice too, so one job produces both downloads. Free on public repos.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run the test suite
        run: npm run smoke:mac
        # macOS runners have a window server, so there is no xvfb here

      - name: Build for Apple Silicon and Intel
        run: npx electron-builder --mac --arm64 --x64 --publish never
        env:
          # There is no paid Apple certificate: without this, electron-builder
          # hunts for a Developer ID in the keychain. package.json asks for an
          # ad-hoc signature instead ("identity": "-"), which needs no account.
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Check the app was actually produced, and is launchable
        run: |
          set -e
          ls -la dist/*.dmg dist/*.zip
          # Every app in the build must carry a whole, valid signature. An app
          # whose signature is missing or broken is what macOS calls "damaged",
          # with no Open Anyway button - so a broken one fails the build here
          # instead of reaching anybody's Mac.
          for APP in dist/mac-arm64/GazBoard.app dist/mac/GazBoard.app; do
            [ -d "$APP" ] || continue
            echo "Inspecting $APP"
            codesign --verify --deep --strict --verbose=2 "$APP"
            codesign -dv "$APP" 2>&1 | grep -E "Signature|Identifier|Format"
            /usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" "$APP/Contents/Info.plist"
            /usr/libexec/PlistBuddy -c "Print :LSMinimumSystemVersion" "$APP/Contents/Info.plist"
          done
          # latest-mac.yml gives the in-app updater each .zip's SHA-512: one
          # for Apple chips and one for Intel, or a Mac cannot update itself
          V="$(node -p "require('./package.json').version")"
          test -f dist/latest-mac.yml || { echo "::error::no dist/latest-mac.yml - is build.publish set in package.json?"; exit 1; }
          grep -q "^version: ${V}$" dist/latest-mac.yml || { echo "::error::latest-mac.yml is not for ${V}"; cat dist/latest-mac.yml; exit 1; }
          grep -Eq "url: .*arm64.*\.zip" dist/latest-mac.yml || { echo "::error::latest-mac.yml has no Apple-chip zip"; cat dist/latest-mac.yml; exit 1; }
          grep -E "url: .*\.zip" dist/latest-mac.yml | grep -vq arm64 || { echo "::error::latest-mac.yml has no Intel zip"; cat dist/latest-mac.yml; exit 1; }
          cat dist/latest-mac.yml

      - name: Upload build output as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: GazBoard-macos
          path: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          if-no-files-found: error

      # The notes come from release-notes/<version>.md, written alongside the
      # code, so a green build publishes finished notes with nobody editing
      # the release by hand afterwards. No file for this version: GitHub's own
      # list of changes, as before.
      - name: Find the release notes for this version
        id: notes
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          F="release-notes/${GITHUB_REF_NAME#v}.md"
          if [ -f "$F" ]; then
            echo "Using $F"
            echo "path=$F" >> "$GITHUB_OUTPUT"
            echo "generate=false" >> "$GITHUB_OUTPUT"
          else
            echo "::warning::No $F - falling back to GitHub's generated notes"
            echo "path=" >> "$GITHUB_OUTPUT"
            echo "generate=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Attach to the GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.zip
            dist/latest-mac.yml
          name: GazBoard ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.path }}
          generate_release_notes: ${{ steps.notes.outputs.generate == 'true' }}

  web:
    needs: [validate-version]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web distribution
        run: npm run build:web

      - name: Run web test suite
        run: npm run test:web
