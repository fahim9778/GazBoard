name: Android
on:
  push:
    branches: [main, 'android/**']
    paths: ['android/**', 'src/**', 'sync/**', 'test/android*', 'package.json', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', 'src/**', 'sync/**', 'test/android*', 'package.json', '.github/workflows/android.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Shared editor checks
        run: |
          node test/tablet-layout.test.js
          node test/sync.test.js
          node --test test/android-adapter.test.js
      - name: Build and check Android
        working-directory: android
        run: gradle :sync:test :app:assembleDebug :app:assembleRelease :app:lintDebug --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GazBoard-Android
          path: |
            android/app/build/outputs/apk/
            android/app/build/reports/
            android/sync/build/reports/tests/
          retention-days: 14
  device:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_tablet
          disable-animations: true
          script: cd android && gradle :app:connectedDebugAndroidTest --stacktrace
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: GazBoard-Android-device-tests
          path: android/app/build/reports/androidTests/
